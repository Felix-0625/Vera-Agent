# Lint settings for repository-level Python (tests/, scripts/, examples/, website/).
# The backend package has its own configuration in vera-agent/pyproject.toml.
line-length = 120
target-version = "py310"
extend-exclude = ["vera-agent", "frontend", "scratch", "mini-coding-agent", "pi-agent", "mcp-sever"]

[lint]
select = ["E", "F", "I", "UP", "N", "B006", "B007", "PT"]
ignore = ["E501"]
