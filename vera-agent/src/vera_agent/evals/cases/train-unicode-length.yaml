id: train-unicode-length
split: train
tags: [fix, python, unicode]
task: |
  昵称长度校验对中文不正确：限制是"最多 8 个字符"，但现在 "张三丰" 这样的名字也被截断了。
  请修复 nickname.py，让 tests/ 中的测试通过。不要修改 tests/ 目录。
fixture:
  nickname.py: |
    """Nickname validation."""

    MAX_CHARS = 8


    def clean(name):
        """Strip whitespace and cut the nickname to at most MAX_CHARS characters."""
        name = name.strip()
        raw = name.encode("utf-8")
        if len(raw) <= MAX_CHARS:
            return name
        return raw[:MAX_CHARS].decode("utf-8", errors="ignore")
  tests/__init__.py: ""
  tests/test_nickname.py: |
    import unittest

    from nickname import clean


    class NicknameTest(unittest.TestCase):
        def test_ascii(self):
            self.assertEqual(clean("  alice  "), "alice")
            self.assertEqual(clean("abcdefghij"), "abcdefgh")

        def test_chinese(self):
            self.assertEqual(clean("张三丰"), "张三丰")
            self.assertEqual(clean("一二三四五六七八九十"), "一二三四五六七八")

        def test_emoji(self):
            self.assertEqual(clean("猫🐱猫🐱猫🐱猫🐱猫"), "猫🐱猫🐱猫🐱猫🐱")
accept: git diff --quiet HEAD -- tests && python -m unittest discover -s tests -t . -q
allowed_commands: []
max_tool_calls: 8
timeout: 60
