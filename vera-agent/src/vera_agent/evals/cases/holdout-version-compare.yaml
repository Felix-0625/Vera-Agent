id: holdout-version-compare
split: holdout
tags: [fix, python, comparison]
task: |
  The updater thinks version "1.9.0" is newer than "1.10.0". Fix `is_newer` in versions.py so
  tests/test_versions.py passes. Do not modify tests/.
fixture:
  versions.py: |
    """Version comparison for the auto-updater."""


    def is_newer(candidate, current):
        """Return True if dotted version ``candidate`` is strictly newer than ``current``.

        Missing components count as 0, so "1.2" equals "1.2.0". A leading "v" is ignored.
        """
        return candidate.lstrip("v") > current.lstrip("v")
  tests/__init__.py: ""
  tests/test_versions.py: |
    import unittest

    from versions import is_newer


    class VersionsTest(unittest.TestCase):
        def test_numeric_components(self):
            self.assertTrue(is_newer("1.10.0", "1.9.0"))
            self.assertFalse(is_newer("1.9.0", "1.10.0"))
            self.assertTrue(is_newer("v2.0", "1.99.99"))

        def test_equal_and_padding(self):
            self.assertFalse(is_newer("1.2", "1.2.0"))
            self.assertFalse(is_newer("1.2.0", "v1.2"))
            self.assertTrue(is_newer("1.2.0.1", "1.2"))
accept: git diff --quiet HEAD -- tests && python -m unittest discover -s tests -t . -q
allowed_commands: ["python -m unittest*"]
max_tool_calls: 8
timeout: 60
