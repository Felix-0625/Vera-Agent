id: train-empty-input-average
split: train
tags: [fix, python, edge-case]
task: |
  `summarize([])` crashes with ZeroDivisionError. Fix stats.py so that empty input is handled as
  described in the docstring and tests/test_stats.py passes. Do not modify tests/.
fixture:
  stats.py: |
    """Summary statistics for sensor readings."""


    def summarize(values):
        """Return ``{"count", "mean", "min", "max"}`` for ``values``.

        For an empty input, count is 0 and mean/min/max are ``None``.
        """
        return {
            "count": len(values),
            "mean": sum(values) / len(values),
            "min": min(values),
            "max": max(values),
        }
  tests/__init__.py: ""
  tests/test_stats.py: |
    import unittest

    from stats import summarize


    class StatsTest(unittest.TestCase):
        def test_values(self):
            self.assertEqual(summarize([2, 4, 9]), {"count": 3, "mean": 5, "min": 2, "max": 9})

        def test_empty(self):
            self.assertEqual(summarize([]), {"count": 0, "mean": None, "min": None, "max": None})

        def test_generator(self):
            self.assertEqual(summarize(x for x in [1, 3])["mean"], 2)
accept: git diff --quiet HEAD -- tests && python -m unittest discover -s tests -t . -q
allowed_commands: ["python -m unittest*"]
max_tool_calls: 8
timeout: 60
