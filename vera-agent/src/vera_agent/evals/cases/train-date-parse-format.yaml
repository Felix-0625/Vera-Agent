id: train-date-parse-format
split: train
tags: [fix, python, date]
task: |
  `parse_date` in dates.py returns the wrong dates for ISO strings and crashes for some of them.
  Fix it so tests/test_dates.py passes. Do not modify tests/.
fixture:
  dates.py: |
    """Date parsing for the import job."""

    from datetime import datetime


    def parse_date(text):
        """Parse an ISO date ``YYYY-MM-DD`` (surrounding whitespace allowed) into a ``date``."""
        return datetime.strptime(text, "%Y-%d-%m").date()


    def days_between(a, b):
        """Return the number of days from date string ``a`` to date string ``b``."""
        return (parse_date(b) - parse_date(a)).days
  tests/__init__.py: ""
  tests/test_dates.py: |
    import unittest
    from datetime import date

    from dates import days_between, parse_date


    class DatesTest(unittest.TestCase):
        def test_parse(self):
            self.assertEqual(parse_date("2024-03-05"), date(2024, 3, 5))
            self.assertEqual(parse_date(" 2024-12-31\n"), date(2024, 12, 31))

        def test_between(self):
            self.assertEqual(days_between("2024-02-28", "2024-03-01"), 2)
            self.assertEqual(days_between("2023-12-31", "2023-01-01"), -364)
accept: git diff --quiet HEAD -- tests && python -m unittest discover -s tests -t . -q
allowed_commands: ["python -m unittest*"]
max_tool_calls: 8
timeout: 60
