id: holdout-no-terminal-pagination
split: holdout
tags: [fix, python, off-by-one, no-terminal]
task: |
  分页函数 `paginate` 的页码是从 1 开始的，但现在第 1 页返回的是第二页的数据，`page_count` 也算错了。
  请修复 pager.py。本任务无法运行终端命令，请仔细阅读代码后直接修改。
fixture:
  pager.py: |
    """Pagination helpers. Pages are 1-based."""


    def page_count(total, per_page):
        """Return how many pages ``total`` items need (0 items -> 0 pages)."""
        return total // per_page


    def paginate(items, page, per_page=10):
        """Return the items on 1-based ``page``; pages out of range return ``[]``."""
        if page < 1:
            return []
        start = page * per_page
        return items[start:start + per_page]
accept: |
  python -c '
  from pager import page_count, paginate
  items = list(range(23))
  assert paginate(items, 1, 10) == list(range(10))
  assert paginate(items, 3, 10) == [20, 21, 22]
  assert paginate(items, 4, 10) == []
  assert paginate(items, 0, 10) == []
  assert page_count(23, 10) == 3 and page_count(20, 10) == 2 and page_count(0, 10) == 0
  print("ok")'
