version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-nonbreaking:
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /vera-agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-nonbreaking:
        update-types:
          - minor
          - patch
