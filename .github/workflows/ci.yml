name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vera-agent
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.11.15'
      - name: Install locked backend and test dependencies
        run: uv sync --locked --extra dev
      - name: Run backend suite
        run: uv run --locked pytest tests
      - name: Exercise the MCP stdio example
        run: uv run --locked python ../examples/mcp-server/test_client.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate static site pages, links, anchors, and assets
        run: python website/check_site.py
