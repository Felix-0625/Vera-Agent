name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vera-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.15'
      - name: Install locked backend and test dependencies
        run: uv sync --locked --extra dev
      - name: Lint and format check
        run: |
          uv run --locked ruff check src tests
          uv run --locked ruff format --check src tests
      - name: Run backend suite
        run: uv run --locked pytest tests
      - name: Lint repository-level Python
        working-directory: .
        run: |
          uv run --project vera-agent --locked ruff check .
          uv run --project vera-agent --locked ruff format --check .
      - name: Run repository checks (examples, docs, hygiene)
        working-directory: .
        run: uv run --project vera-agent --locked pytest tests
      - name: Exercise the MCP stdio example
        run: uv run --locked python ../examples/mcp-server/test_client.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate static site pages, links, anchors, and assets
        run: python website/check_site.py
