name: Publish Windows bootstrapper to npm

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this package version to npm (otherwise run a dry run only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check package contents without publishing
        run: npm publish --dry-run --access public --registry=https://registry.npmjs.org

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: verify-package
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted-publishing support
        run: npm install --global 'npm@^11.5.1'
      - name: Publish with npm trusted publishing
        run: npm publish --access public --registry=https://registry.npmjs.org
